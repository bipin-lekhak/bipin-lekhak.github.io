- section: "Manuscripts under review"
  items:
    - title: "iASIDE: Identifiable, Adaptable, and Separable Interventional Dynamics"
      authors: ["Bipin Lekhak", "Yubo Ye", "Suraj Poudel", "Ruby Shrestha", "Linwei Wang"]
      venue: "Manuscript under review"
      year: 2026
      summary: >-
        A latent-dynamics framework that predicts how a system responds to hypothetical
        interventions. It establishes identifiability of the latent interventional dynamics by
        conditioning non-stationary parameters on history, and separates native from response
        dynamics so that optimisation can reach the identifiable solution.

