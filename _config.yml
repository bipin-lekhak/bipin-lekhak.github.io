# Site settings
title: "Bipin Lekhak"
tagline: "PhD candidate, causal machine learning for time series"
description: >-
  Bipin Lekhak is a PhD candidate at the Rochester Institute of Technology working on
  causal machine learning for time series: latent-dynamics models that predict how
  patients and physical systems respond to interventions.
url: "https://bipinlekhak.com.np"
baseurl: ""
lang: en

author:
  name: "Bipin Lekhak"
  email: "bl1282@rit.edu"

# Profiles, used by the header links and by jekyll-seo-tag
social:
  name: "Bipin Lekhak"
  links:
    - "https://github.com/bipin-lekhak"
    - "https://www.linkedin.com/in/bipin-lekhak/"
    - "https://scholar.google.com/citations?user=z8T6GewAAAAJ"
    - "https://openreview.net/profile?id=~Bipin_Lekhak2"

github_username: bipin-lekhak
linkedin_username: bipin-lekhak
scholar_url: "https://scholar.google.com/citations?user=z8T6GewAAAAJ"
openreview_url: "https://openreview.net/profile?id=~Bipin_Lekhak2"
cv_pdf: /assets/cv/Bipin_Lekhak_CV.pdf
# Square portrait for the home page, e.g. /assets/img/profile.jpg; empty hides it
photo:

# Google Analytics 4 measurement ID, carried over from the old site; empty to turn off
google_analytics: "G-GGQGXQ43E9"

# Build settings (GitHub Pages builds this with the github-pages gem)
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
highlighter: rouge

# Old notes keep their URLs (/books/linalg.html, /paper/vae.html, ...); they are listed only
# on the unlinked /archive/ page
permalink: none

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math: true
      sitemap: false
      noindex: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
